name: CI
on: pull_request

jobs:
  tests:
    name: runner / tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v2
      - uses: actions/setup-go@v2
        with:
          go-version: 1.23.6
      - name: Unit Tests
        run: |
          go test -v ./server/...

  golangci-lint:
    name: runner / golangci-lint
    runs-on: ubuntu-latest
    steps:
      - name: Check out code into the Go module directory
        uses: actions/checkout@v2
      - name: Setting Go version
        uses: actions/setup-go@v2
        with:
          go-version: 1.23.6
      - name: golangci-lint
        run: golangci-lint run
